name: artifact-test
on:
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Create test file
        run: |
          mkdir -p out
          printf 'RASD workflow artifact connector test\n' > out/hello.txt
      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: rasd-test-artifact
          path: out/hello.txt
          compression-level: 0
          retention-days: 1

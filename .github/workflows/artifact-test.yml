name: artifact-test
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/artifact-test.yml'
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Create test file
        run: |
          mkdir -p out
          printf 'RASD workflow artifact connector test\n' > out/hello.txt
      - name: Upload test artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: rasd-test-artifact
          path: out/hello.txt
          compression-level: 0
          retention-days: 1
      - name: Publish artifact metadata to repository
        env:
          RUN_ID: ${{ github.run_id }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          printf '{"run_id":%s,"artifact_id":%s,"artifact_url":"%s"}\n' "$RUN_ID" "$ARTIFACT_ID" "$ARTIFACT_URL" > latest-artifact.json
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add latest-artifact.json
          git commit -m 'Publish latest artifact metadata [skip ci]'
          git push

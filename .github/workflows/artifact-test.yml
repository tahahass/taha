name: artifact-test
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/artifact-test.yml'
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Create test file
        run: |
          mkdir -p out
          printf 'RASD release connector test\n' > out/hello.txt
      - name: Publish temporary release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete rasd-artifact-test --yes --cleanup-tag 2>/dev/null || true
          gh release create rasd-artifact-test out/hello.txt --title 'RASD artifact test' --notes 'Temporary connector test'
